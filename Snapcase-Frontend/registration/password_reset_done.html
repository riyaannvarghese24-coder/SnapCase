{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCase | Password Reset Sent</title>
    <link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <header class="login-header">
            <img src="{% static 'images/snapcaseLogo.png' %}" alt="SnapCase logo">
            <h1>Check your email</h1>
            <p class="login-subtitle">If an account matches that email, password reset instructions have been sent.</p>
        </header>
        <a href="{% url 'login' %}" class="primary-login-button" style="display: block; text-align: center; text-decoration: none;">Back to login</a>
    </main>
</body>
</html>
