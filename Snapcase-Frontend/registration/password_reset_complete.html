{% extends 'admin_base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block page_title %}Password Reset Complete{% endblock %}

{% block content %}
<section class="panel" style="max-width: 520px; margin: 2rem auto;">
    <h3 class="panel-title">Success</h3>
    <p style="color: #4b5563;">Your password has been reset successfully. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="primary-button" style="display:inline-flex; margin-top: 1rem;">Go to login</a>
</section>
{% endblock %}
