{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCase | Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="auth-back-link" href="{% url 'login' %}">&larr; Back to login</a>
        <header class="login-header">
            <img src="{% static 'images/snapcaseLogo.png' %}" alt="SnapCase logo">
            <h1>Reset your password</h1>
            <p class="login-subtitle">Enter your account email and we will send you a password reset link.</p>
        </header>
        <form method="post" class="form-stack">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="primary-login-button">Send reset link</button>
        </form>
    </main>
</body>
</html>
