{% extends 'admin_base.html' %}
{% block title %}Reset Your Password{% endblock %}
{% block page_title %}Choose a New Password{% endblock %}

{% block content %}
<section class="panel" style="max-width: 520px; margin: 2rem auto;">
    <h3 class="panel-title">Set a new password</h3>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-button">Update password</button>
    </form>
</section>
{% endblock %}
