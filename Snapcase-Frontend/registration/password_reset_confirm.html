{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCase | Choose a New Password</title>
    <link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="auth-back-link" href="{% url 'login' %}">&larr; Back to login</a>
        <header class="login-header">
            <img src="{% static 'images/snapcaseLogo.png' %}" alt="SnapCase logo">
            <h1>Choose a new password</h1>
        </header>
        {% if validlink %}
            <form method="post" class="form-stack">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="primary-login-button">Update password</button>
            </form>
        {% else %}
            <p class="login-subtitle">This password reset link is invalid or has expired. Request a new link to continue.</p>
            <div class="text-links">
                <a href="{% url 'auth:password_reset' %}">Request a new reset link</a>
            </div>
        {% endif %}
    </main>
</body>
</html>
